name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Consumers install from this repo as a git dependency, so dist/ must
      # exist in the tree. CI commits it on main; [skip ci] prevents a loop.
      # (dist stays gitignored locally so local builds never pollute.)
      - name: Commit dist on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "ui-kit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist unchanged"
          else
            git commit -m "build: dist for ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
