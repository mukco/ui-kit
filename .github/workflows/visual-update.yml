name: Update visual baselines

# Rewrites test/visual/baselines from this machine and commits them to the
# branch it runs on — the way to accept a change that is meant to look
# different, and to make the first baselines.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run visual:update
      - name: Commit baselines
        run: |
          git config user.name "ui-kit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add test/visual/baselines
          if git diff --cached --quiet; then
            echo "baselines unchanged"
          else
            git commit -m "test: visual baselines for ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
